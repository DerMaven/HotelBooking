services:
  redis:
    image: redis:latest
    container_name: hotel-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "UKGarageBruv1"
    networks:
      - hotel-network
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:18.6
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
